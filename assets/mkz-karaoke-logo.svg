<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Color Gradient -->
    <linearGradient id="mkzCyanGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #60A5FA; #818CF8; #38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA; #818CF8; #38BDF8; #60A5FA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#E3E3E3">
        <animate attributeName="stop-color" values="#E3E3E3; #38BDF8; #60A5FA; #E3E3E3" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="micMetallicSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#234C6A" />
      <stop offset="100%" stop-color="#1B3C53" />
    </linearGradient>

    <!-- Radial Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#234C6A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B3C53" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowSquare" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadowSquare" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Musical Note Definition -->
    <g id="noteSquare">
      <path d="M12 30 C12 35 9 39 5 39 C1.6 39 0 36.4 0 33 C0 29 3 25 7 25 C9 25 11 26 12 28 V8 L28 3 V21 C28 26 25 30 21 30 C17.6 30 16 27.4 16 24 C16 20 19 16 23 16 C25 16 27 17 28 19 V8 L12 13 Z" />
    </g>
  </defs>

  <!-- Dark Rounded Container with Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#1B3C53" stroke="rgba(69, 104, 130, 0.4)" stroke-width="4" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" />

  <!-- Pulsing Soundwave Rings -->
  <g transform="translate(256, 230)" filter="url(#neonGlowSquare)">
    <circle r="140" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.3">
      <animate attributeName="r" values="120; 165; 120" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 0; 0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="100" fill="none" stroke="#60A5FA" stroke-width="5" opacity="0.5">
      <animate attributeName="r" values="90; 130; 90" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7; 0.1; 0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Musical Notes -->
  <g opacity="0.8" filter="url(#neonGlowSquare)">
    <use href="#noteSquare" x="65" y="240" fill="#38BDF8" transform="scale(1.1)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,-50; -30,-90" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.95; 0" dur="4s" repeatCount="indefinite" />
    </use>
    <use href="#noteSquare" x="390" y="250" fill="#60A5FA">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-45; 25,-85" dur="4.6s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="opacity" values="0; 0.85; 0" dur="4.6s" repeatCount="indefinite" begin="1.5s" />
    </use>
  </g>

  <!-- Stylized Studio Microphone -->
  <g transform="translate(186, 95)" filter="url(#softShadowSquare)">
    <!-- Mic Capsule Grill -->
    <rect x="40" y="20" width="60" height="90" rx="30" fill="url(#mkzCyanGradSquare)" filter="url(#neonGlowSquare)" />
    <!-- Mesh Texture -->
    <path d="M40 50 H100 M40 70 H100 M70 20 V110" stroke="#1B3C53" stroke-width="3" opacity="0.6" />
    
    <!-- Metallic Ring -->
    <rect x="34" y="105" width="72" height="12" rx="6" fill="#E3E3E3" />

    <!-- Mic Handle -->
    <path d="M54 117 L48 185 C48 192 55 200 70 200 C85 200 92 192 92 185 L86 117 Z" fill="url(#micMetallicSquare)" />

    <!-- U-Shaped Stand Bracket -->
    <path d="M20 80 C20 145 120 145 120 80" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" filter="url(#neonGlowSquare)" />
    <!-- Stand Base Pole -->
    <path d="M70 135 V230 M40 230 H100" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: MKZ Badge -->
  <g transform="translate(256, 395)" filter="url(#neonGlowSquare)">
    <!-- MKZ Text -->
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="52" 
          fill="url(#mkzCyanGradSquare)"
          letter-spacing="2">
      MKZ
    </text>
    <!-- Subtitle: KARAOKE -->
    <text x="0" y="32" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="22" 
          fill="#E3E3E3"
          letter-spacing="6">
      KARAOKE
    </text>
  </g>

  <!-- Equalizer Audio Visualizer Line at Bottom -->
  <g transform="translate(156, 455)" filter="url(#neonGlowSquare)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#38BDF8">
      <animate attributeName="height" values="8;24;12;20;8" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="0" width="8" height="24" rx="4" fill="#60A5FA">
      <animate attributeName="height" values="22;8;26;10;22" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="36" y="0" width="8" height="14" rx="4" fill="#818CF8">
      <animate attributeName="height" values="10;26;8;22;10" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="156" y="0" width="8" height="24" rx="4" fill="#38BDF8">
      <animate attributeName="height" values="24;10;20;8;24" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="174" y="0" width="8" height="16" rx="4" fill="#60A5FA">
      <animate attributeName="height" values="8;20;12;26;8" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="192" y="0" width="8" height="12" rx="4" fill="#818CF8">
      <animate attributeName="height" values="12;24;8;18;12" dur="1.6s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
