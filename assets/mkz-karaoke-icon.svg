<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mkzIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1b2b" />
      <stop offset="50%" stop-color="#152b42" />
      <stop offset="100%" stop-color="#091522" />
    </linearGradient>

    <linearGradient id="mkzIconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="micIconMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#234C6A" />
      <stop offset="100%" stop-color="#112435" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#mkzIconBg)" stroke="#38BDF8" stroke-width="2.5" filter="url(#iconGlow)" />

  <!-- Concentric Soundwave Orbit Ring -->
  <circle cx="50" cy="48" r="32" stroke="url(#mkzIconCyan)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Floating Music Notes -->
  <path d="M72 26 C72 28.5 70 30 68 30 C66.5 30 65.5 29 65.5 27.5 C65.5 25.8 67 24 68.5 24 C69.5 24 70.5 24.5 71 25.2 V18 L77 16.5 V22.5 C77 24.5 75.5 26 74 26 C72.8 26 72 25 72 23.8 C72 22.2 73.2 20.8 74.5 20.8 C75.2 20.8 76 21.2 76.5 22 V18 L72 19.5 Z" fill="#38BDF8" opacity="0.85" />
  <path d="M24 68 C24 70 22.5 71 21 71 C19.8 71 19 70.2 19 69 C19 67.5 20 66.2 21.5 66.2 C22.2 66.2 23 66.6 23.5 67.2 V61 L28 59.8 V64.5 C28 66 26.8 67.2 25.5 67.2 C24.5 67.2 24 66.5 24 65.5 C24 64.2 25 63 26 63 C26.5 63 27.2 63.3 27.5 64 V61 L24 62 Z" fill="#60A5FA" opacity="0.75" />

  <!-- Center Stylized Studio Microphone -->
  <g transform="translate(2, -2)">
    <!-- Capsule Grill -->
    <rect x="40" y="24" width="16" height="24" rx="8" fill="url(#mkzIconCyan)" />
    <!-- Mesh Cross -->
    <path d="M40 32 H56 M40 38 H56 M48 24 V48" stroke="#0F2336" stroke-width="1.2" opacity="0.8" />
    
    <!-- Collar Accent -->
    <rect x="38" y="46" width="20" height="3" rx="1.5" fill="#E3E3E3" />

    <!-- Mic Stem / Handle -->
    <path d="M43 49 L41 68 C41 70 44 72 48 72 C52 72 55 70 55 68 L53 49 Z" fill="url(#micIconMetal)" />

    <!-- U-Shaped Stand Bracket -->
    <path d="M33 38 C33 58 63 58 63 38" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <!-- Stand Base Pole -->
    <path d="M48 56 V78 M38 78 H58" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
