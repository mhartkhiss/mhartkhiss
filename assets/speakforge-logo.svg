<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Amber / Orange Gradient for Upper Arrow -->
    <linearGradient id="forgeAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FBA834" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Cool Azure / Cyan Gradient for Lower Arrow -->
    <linearGradient id="neuralBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#387ADF" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="forgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#forgeShadow)">
    <!-- Upper Orange Translation Ribbon (Leading into 'A' node) -->
    <!-- Curved sweeping arrow pointing up-right and circling into the central node -->
    <path d="M 12 50 C 12 28 30 10 52 10 L 68 10 C 62 16 62 26 68 32 L 38 32 C 28 32 24 38 24 46 L 24 50 Z" fill="url(#forgeAmberGrad)" />
    <!-- Arrowhead top right -->
    <path d="M 60 4 L 76 10 L 60 20 Z" fill="#FBA834" />

    <!-- Upper Speech Node 'A' -->
    <circle cx="72" cy="24" r="14" fill="#FFFFFF" stroke="#FBA834" stroke-width="2.5" />
    <text x="72" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#1E293B" text-anchor="middle">A</text>

    <!-- Lower Blue Translation Ribbon (Leading into '文' node) -->
    <!-- Curved sweeping arrow pointing down-left and circling into the central node -->
    <path d="M 88 50 C 88 72 70 90 48 90 L 32 90 C 38 84 38 74 32 68 L 62 68 C 72 68 76 62 76 54 L 76 50 Z" fill="url(#neuralBlueGrad)" />
    <!-- Arrowhead bottom left -->
    <path d="M 40 96 L 24 90 L 40 80 Z" fill="#38BDF8" />

    <!-- Lower Speech Node '文' -->
    <circle cx="28" cy="76" r="14" fill="#FFFFFF" stroke="#387ADF" stroke-width="2.5" />
    <text x="28" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#1E293B" text-anchor="middle">文</text>
  </g>
</svg>
