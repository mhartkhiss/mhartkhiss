<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="50%" stop-color="#161625" />
      <stop offset="100%" stop-color="#1a1b2e" />
    </linearGradient>

    <!-- Neon Cyber Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0" />
    </linearGradient>

    <!-- Scanning Light Effect -->
    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      @keyframes scanline {
        0% { transform: translateX(-800px); }
        100% { transform: translateX(800px); }
      }
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes borderShine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }
      .pulse-dot {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 690px 42px;
      }
      .scanner {
        animation: scanline 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .floating-badge {
        animation: floatIcon 3s ease-in-out infinite;
      }
      .dash-glow {
        stroke-dasharray: 200 600;
        animation: borderShine 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="796" height="216" rx="14" fill="url(#bgGradient)" stroke="#2f334d" stroke-width="1.5" />

  <!-- Animated Border Glow -->
  <rect x="2" y="2" width="796" height="216" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6" class="dash-glow" />

  <!-- Scanning Light Sweep -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="2" y="2" width="796" height="216" rx="14" />
    </clipPath>
    <rect x="0" y="2" width="300" height="216" fill="url(#scanbeam)" opacity="0.15" class="scanner" />
  </g>

  <!-- Tech Grid Accent Lines -->
  <line x1="40" y1="2" x2="40" y2="218" stroke="#24283b" stroke-width="1" opacity="0.5" />
  <line x1="760" y1="2" x2="760" y2="218" stroke="#24283b" stroke-width="1" opacity="0.5" />
  <line x1="2" y1="168" x2="798" y2="168" stroke="#24283b" stroke-width="1" opacity="0.5" />

  <!-- Cyber Gamepad Icon & Hexagon Container -->
  <g class="floating-badge" transform="translate(60, 45)">
    <!-- Hexagon Outer -->
    <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#1f2335" stroke="url(#accentGrad)" stroke-width="1.8" filter="url(#neonGlow)" />
    <!-- Gamepad Controller Graphic -->
    <path d="M22,33 C20,33 17,35 17,38 L17,45 C17,48 19,50 22,50 C23,50 24,49 25,48 L28,45 L42,45 L45,48 C46,49 47,50 48,50 C51,50 53,48 53,45 L53,38 C53,35 50,33 48,33 Z" fill="none" stroke="#7dcfff" stroke-width="2" stroke-linejoin="round" />
    <!-- D-Pad -->
    <path d="M25,38 L25,44 M22,41 L28,41" stroke="#bb9af7" stroke-width="1.8" stroke-linecap="round" />
    <!-- Buttons -->
    <circle cx="43" cy="39" r="1.3" fill="#7aa2f7" />
    <circle cx="47" cy="43" r="1.3" fill="#7aa2f7" />
  </g>

  <!-- Header & Title -->
  <text x="150" y="68" font-family="'Segoe UI', -apple-system, Roboto, 'Fira Code', monospace" font-size="28" font-weight="800" fill="url(#accentGrad)" letter-spacing="2">
    DUSKCORE
  </text>
  <text x="322" y="66" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="12" font-weight="700" fill="#f7768e" letter-spacing="1.5">
    // MEMORY TRAINER
  </text>

  <!-- Live Status Chip -->
  <rect x="620" y="44" width="135" height="26" rx="13" fill="#1f2335" stroke="#414868" stroke-width="1" />
  <circle cx="636" cy="57" r="4.5" fill="#9ece6a" class="pulse-dot" />
  <text x="648" y="61" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="11" font-weight="700" fill="#9ece6a" letter-spacing="1">
    TASKBARHERO
  </text>

  <!-- Subtitle / Tagline -->
  <text x="150" y="98" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14.5" fill="#c0caf5" font-weight="500">
    High-Performance Memory Trainer &amp; "Quality-of-Life Acceleration" Suite
  </text>

  <!-- Sarcastic Hook Line -->
  <text x="150" y="123" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" fill="#7982a9" font-style="italic">
    "Why grind 100 hours of clicking when you can respectfully rewire memory addresses into believing you're a god?"
  </text>

  <!-- Tags / Chips Bar -->
  <g transform="translate(150, 137)">
    <!-- Flutter Desktop -->
    <rect x="0" y="0" width="108" height="22" rx="4" fill="#1a1b26" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="54" y="15" font-family="'Fira Code', monospace" font-size="10.5" fill="#38bdf8" font-weight="600" text-anchor="middle">Flutter Desktop</text>

    <!-- C# / IL2CPP -->
    <rect x="116" y="0" width="94" height="22" rx="4" fill="#1a1b26" stroke="#a855f7" stroke-width="1" opacity="0.9" />
    <text x="163" y="15" font-family="'Fira Code', monospace" font-size="10.5" fill="#a855f7" font-weight="600" text-anchor="middle">C# • IL2CPP</text>

    <!-- Windows / Web -->
    <rect x="218" y="0" width="112" height="22" rx="4" fill="#1a1b26" stroke="#22c55e" stroke-width="1" opacity="0.9" />
    <text x="274" y="15" font-family="'Fira Code', monospace" font-size="10.5" fill="#22c55e" font-weight="600" text-anchor="middle">Windows &amp; Web</text>

    <!-- Memory Hooks -->
    <rect x="338" y="0" width="124" height="22" rx="4" fill="#1a1b26" stroke="#e0af68" stroke-width="1" opacity="0.9" />
    <text x="400" y="15" font-family="'Fira Code', monospace" font-size="10.5" fill="#e0af68" font-weight="600" text-anchor="middle">Assembly Hooks</text>
  </g>

  <!-- Bottom Interactive Bar -->
  <g transform="translate(45, 178)">
    <text x="15" y="21" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" fill="#565f89" font-weight="600">
      EXPLORE THE UTILITY:
    </text>

    <!-- Web App Link Badge -->
    <g transform="translate(180, 4)">
      <rect x="0" y="0" width="220" height="25" rx="5" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2" />
      <text x="12" y="17" font-family="'Fira Code', monospace" font-size="11.5" fill="#7dcfff" font-weight="700">🌐 duskcore.makizz.studio</text>
    </g>

    <!-- Anti-Cheat Bypass Badge -->
    <g transform="translate(415, 4)">
      <rect x="0" y="0" width="280" height="25" rx="5" fill="#24283b" stroke="#f7768e" stroke-width="1" opacity="0.8" />
      <text x="140" y="17" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" fill="#f7768e" font-weight="600" text-anchor="middle">🛡️ ACTk Anti-Cheat Bypass &amp; RAM Sweeper</text>
    </g>
  </g>
</svg>
